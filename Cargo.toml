[package]
name = "warden-worker"
version = "1.3.0"
edition = "2024"
authors = ["SNAKEGC"]

[package.metadata.release]
release = false
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1

[dependencies]
# Worker & Web APIs
worker = { version = "0.8.5", features = ["axum", "http", "d1"] }
worker-macros = { version = "0.8.5", features = ['http'] }
wasm-bindgen = "0.2.126"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Crypto"] }
console_error_panic_hook = "0.1.7"

# Axum and Routing
axum = { version = "0.8.9", default-features = false, features=["json", "macros", "form", "multipart", "query"] }
tower-service = "0.3.3"
tower-http = { version = "0.7", features = ["cors"] }

# Data & Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Crypto & Encoding
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"], default-features = false }
base64 = "0.22.1"
hex = "0.4"
data-encoding = "2.11.0"
rand = { version = "0.8.7" }
getrandom = { version = "0.3.4", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4.3", features = ["wasm_js"] }
constant_time_eq = "0.5.0"
aes-gcm = "0.10"
totp-rs = { version = "5.7.2", default-features = false, features = ["otpauth", "gen_secret", "qr"] }
sha2 = "0.10"
sha1 = "0.10"
p256 = { version = "0.13", features = ["ecdsa"] }
rsa = { version = "0.9", features = ["sha2"] }
serde_cbor_2 = "0.13"
ciborium = "0.2"
argon2 = "0.5"

# Utilities
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "serde", "rng-rand"] }
url = "2.5"
semver = "1.0"
log = "0.4.33"
thiserror = "2.0.18"
once_cell = "1.21.4"
console_log = "1.1.0"
pbkdf2 = "0.12.2"
hmac = "0.12.1"
futures = "0.3.33"

[lints.rust]
rust_2024_compatibility = "warn"
unused = "warn"

[lints.clippy]
complexity = "warn"
style = "warn"
